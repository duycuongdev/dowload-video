<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Download videos from TikTok, YouTube, Facebook and Instagram in the best available quality." />
  <title>VideoSave - Multi-Platform Video Downloader</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
  <!-- Animated background -->
  <div class="bg-animation">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div id="app">
    <header>
      <div class="logo">
        <!-- Same bolt as favicon, filled with the brand gradient -->
        <svg width="26" height="25" viewBox="0 0 48 46" fill="none">
          <defs>
            <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#8b5cf6" />
              <stop offset="100%" stop-color="#25f4ee" />
            </linearGradient>
          </defs>
          <path fill="url(#gradient)" d="M25.946 44.938c-.664.845-2.021.375-2.021-.698V33.937a2.26 2.26 0 0 0-2.262-2.262H10.287c-.92 0-1.456-1.04-.92-1.788l7.48-10.471c1.07-1.497 0-3.578-1.842-3.578H1.237c-.92 0-1.456-1.04-.92-1.788L10.013.474c.214-.297.556-.474.92-.474h28.894c.92 0 1.456 1.04.92 1.788l-7.48 10.471c-1.07 1.498 0 3.579 1.842 3.579h11.377c.943 0 1.473 1.088.89 1.83L25.947 44.94z" />
        </svg>
        <h1>VideoSave</h1>
      </div>
    </header>

    <main class="container">
      <div class="hero">
        <h2 class="title">Download Videos<br>From Any Platform</h2>
        <p class="subtitle">TikTok · YouTube · Facebook · Instagram — best quality, no watermark</p>
      </div>

      <div class="search-box">
        <form id="download-form">
          <div class="input-group">
            <svg class="link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
            </svg>
            <input type="text" id="url-input" placeholder="Paste video URL (TikTok, YouTube, Facebook, Instagram...)"
              required autocomplete="off">
            <button type="button" id="paste-btn" class="icon-btn" title="Paste from clipboard">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
              </svg>
            </button>
          </div>
          <button type="submit" id="submit-btn" class="primary-btn">
            <span>Get Video</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>
        </form>
        <div id="loading" class="hidden">
          <div class="spinner"></div>
          <p>Extracting video information...</p>
        </div>
        <div id="error-message" class="error hidden"></div>
      </div>

      <!-- Download history (localStorage): 3 newest visible, scroll for older -->
      <div id="history-container" class="history-box hidden"></div>

      <!-- Result Container -->
      <div id="result-container" class="result-box hidden">
        <!-- Populated by JS -->
      </div>
    </main>

    <footer>
      <p>&copy; 2026 VideoSave.</p>
    </footer>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
